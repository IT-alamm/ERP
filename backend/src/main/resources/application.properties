server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:change-this-to-min-256-bit-secret-key-for-dev-only-please-change-in-prod-1234567890}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXP:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXP:604800000}
# Local disk storage for now. S3/MinIO baad me (Phase 9). Payment gateway bhi baad me.
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
