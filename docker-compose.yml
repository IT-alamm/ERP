services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: emp-backend:latest
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    image: emp-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
